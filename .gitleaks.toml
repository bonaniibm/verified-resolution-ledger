# Default gitleaks rules, plus a narrow allow-list for public constants that trip the generic-api-key rule.
[extend]
useDefault = true

[allowlist]
description = "Azure built-in role definition IDs (public, documented constants; not secrets)"
regexes = [
  '''4633458b-17de-408a-b874-0445c86b69e6''', # Key Vault Secrets User
  '''b86a8fe4-44ce-4948-aee5-eccb2c155cd7''', # Key Vault Secrets Officer
]
